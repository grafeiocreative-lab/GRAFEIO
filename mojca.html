<script>
(function(){
  try {
    var ua = navigator.userAgent || '';
    if (/FBAN|FBAV|FB_IAB|FBSV|Instagram|Line\/|MicroMessenger/i.test(ua)) {
      document.documentElement.classList.add('iab');
      if (!sessionStorage.getItem('iabRedirectTried')) {
        sessionStorage.setItem('iabRedirectTried', '1');
        var url = location.href.split('#')[0];
        if (/Android/i.test(ua)) {
          location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (/iPhone|iPad|iPod/i.test(ua)) {
          location.href = url.replace(/^https:\/\//, 'x-safari-https://');
        }
      }
    }
  } catch (e) {}
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--obsidian:#111111;--terracotta:#C4521A;--slate:#4A7BA5;--sage:#6A9970;--cream:#F5F5F3}
body{font-family:'Helvetica Neue','Liberation Sans',Helvetica,Arial,sans-serif;background:#E8E8E5;min-height:100dvh;-webkit-font-smoothing:antialiased}
.ld{border-radius:1px}
#mainScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px 16px}
.card-wrapper{perspective:1200px;width:100%;max-width:420px;aspect-ratio:1.7/1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card-wrapper.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;display:flex;box-shadow:0 8px 32px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.12)}
.front{background:var(--obsidian)}
.front-left{width:44%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.front-left .logo-g{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:min(28vw,160px);font-weight:400;color:#fff;line-height:.85;margin-left:-10%}
.front-right{width:56%;min-width:0;padding:16px 24px 16px 8px;display:flex;flex-direction:column;justify-content:safe center}
.squares{display:flex;gap:5px;margin-bottom:10px}
.sq{width:13px;height:13px;border-radius:1px}
.sq-t{background:var(--terracotta)}.sq-s{background:var(--slate)}.sq-g{background:var(--sage)}
.front-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;overflow-wrap:anywhere}
.front-tagline{font-size:11.5px;font-weight:300;font-style:italic;color:rgba(255,255,255,.55);margin-top:4px;line-height:1.25}
.accent-line{width:100%;max-width:140px;height:2.5px;background:var(--terracotta);border-radius:1px;margin:8px 0}
.front-contact{display:flex;flex-direction:column;gap:2px;min-width:0}
.front-contact span{font-size:11.5px;font-weight:400;color:rgba(255,255,255,.7);letter-spacing:.2px;line-height:1.25;overflow-wrap:anywhere}
.front-contact span:last-child{font-weight:500;color:rgba(255,255,255,.85)}
.back{background:var(--cream);transform:rotateY(180deg);flex-direction:column;justify-content:space-between;padding:28px 24px}
.back-top{display:flex;justify-content:space-between;align-items:flex-start}
.back-logo{display:flex;align-items:baseline;gap:8px}
.back-logo .g{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:42px;font-weight:400;color:var(--obsidian);line-height:.85}
.back-logo .wm{font-size:18px;font-weight:300;letter-spacing:5px;color:var(--obsidian)}
.back-sub{font-size:10px;color:rgba(17,17,17,.35);margin-top:2px;margin-left:52px}
.back-taglines{margin-top:auto}
.back-taglines p{font-size:14px;font-weight:400;font-style:italic;color:var(--obsidian);line-height:1.6}
.back-keywords{margin-top:12px;display:flex;gap:8px;font-size:10px;font-weight:700;letter-spacing:.5px}
.kw-t{color:var(--terracotta)}.kw-s{color:var(--slate)}.kw-o{color:var(--obsidian)}
.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:flex;align-items:center;gap:8px;padding:12px 20px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:400;letter-spacing:.3px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;transition:opacity .2s}
.btn:active{opacity:.7}
.btn-dark{background:var(--obsidian);color:var(--cream)}
.btn-light{background:#fff;color:var(--obsidian);border:1px solid rgba(17,17,17,.12)}
.btn svg{flex-shrink:0}
.hint{margin-top:14px;font-size:11px;font-weight:300;color:rgba(17,17,17,.3);text-align:center}
.iab-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--obsidian);color:var(--cream);padding:10px 16px;font-size:12.5px;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.2)}
html.iab .iab-banner{display:flex}
html.iab body{padding-top:52px}
.iab-banner span{opacity:.85}
.iab-banner a{color:#fff;background:var(--terracotta);padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:600;white-space:nowrap;flex-shrink:0}
</style>

<body>
<div class="iab-banner"><span>Za pravilen prikaz odpri v brskalniku.</span><a href="#" id="iabOpenLink">Odpri v brskalniku</a></div>
<script>
(function(){
  var link = document.getElementById('iabOpenLink');
  if (!link) return;
  var ua = navigator.userAgent || '';
  var url = location.href.split('#')[0];
  var target = url;
  if (/Android/i.test(ua)) {
    target = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    target = url.replace(/^https:\/\//, 'x-safari-https://');
  }
  link.href = target;
})();
</script>

<!-- Dostop do te vsebine preveri Netlify Edge Function, preden se HTML pošlje obiskovalcu. -->
<div id="mainScreen">
  <div class="card-wrapper" id="card" role="button" tabindex="0" aria-label="Obrni vizitko" onclick="this.classList.toggle('flipped')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('flipped')}">

      Shrani kontakt
    </button>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4521A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      Pokliči
    </a>
  </div>
  <div class="hint">Klikni na vizitko za obrat</div>
</div>

<script>
// Kontaktni podatki se sestavijo po strežniško preverjenem dostopu.
function buildCard() {
  const d = {
    fn:    ['\u004d\u006f\u006a\u0063\u0061', '\u0042\u0061\u0062\u0069\u010d'].join(' '),
    tel:   ['+386', '(0)40', '467', '277'].join(' '),
    email: ['grafeio.creative', '@', 'gmail.com'].join(''),
    web:   'grafeio.si',
    telRaw:'+38640467277'
  };
  document.getElementById('fn').textContent       = d.fn;
  document.getElementById('fc-tel').textContent   = d.tel;
  document.getElementById('fc-email').textContent = d.email;
  document.getElementById('fc-web').textContent   = d.web;
  document.getElementById('btnCall').href         = 'tel:' + d.telRaw;
  window._cd = d;
}

function downloadVCard() {
  const d = window._cd;
  if (!d) return;
  const v = [
    'BEGIN:VCARD','VERSION:3.0',
    'FN:' + d.fn,
    'N:Babi\u010d;Mojca;;;',
    'ORG:GRAFEIO',
    'TITLE:Kompleksno postane preprosto.',
    'TEL;TYPE=WORK,VOICE:' + d.telRaw,
    'EMAIL;TYPE=WORK:' + d.email,
    'URL:https://' + d.web,
    'NOTE:GRAFEIO \u00b7 Gradnik odli\u010dnosti',
    'END:VCARD'
  ].join('\r\n');
  const b = new Blob([v], {type:'text/vcard;charset=utf-8'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = 'Mojca-Babic-GRAFEIO.vcf';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(u);
}

buildCard();
</script>
